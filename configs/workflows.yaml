workflows:
  code_first:
    description: 'Run all gates once (Week-1). Later: code -> test -> quality.'
    budget:
      max_iterations: 3
      max_tool_calls: 20
      max_seconds: 600
    order:
    - gates_full
  iterative_loop:
    description: 'Week-1 placeholder. Later: generate -> test -> repair -> repeat
      -> final gates.'
    budget: &id001
      max_iterations: 5
      max_tool_calls: 30
      max_seconds: 900
    order: &id002
    - gates_full
  iterative_loop_week3:
    description: 'Week-1 placeholder. Later: generate -> test -> repair -> repeat
      -> final gates.'
    budget: *id001
    order: *id002
    enable_mutation: true
    mutation_scope: example_pkg.math_utils*
    mutation_strengthen: false
    mutation_max_iter: 3
    mutation_max_mutants_per_iter: 3
    mutation_target_score: 1.0
    enable_coverage: true
    coverage_target_pct: 100.0
    coverage_strengthen: true
    coverage_max_iter: 1
    coverage_test_target: tests/test_math_utils.py
